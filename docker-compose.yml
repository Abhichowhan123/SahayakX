# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  serveease-net:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  mongo-auth-data:
  mongo-user-data:
  mongo-worker-data:
  mongo-booking-data:
  mongo-payment-data:
  mongo-review-data:
  mongo-admin-data:
  redis-data:
  rabbitmq-data:

services:

  # ─── Infrastructure ────────────────────────────────────────────────────────

  mongo-auth:
    image: mongo:7
    container_name: serveease-mongo-auth
    volumes:
      - mongo-auth-data:/data/db
    networks: [serveease-net]
    environment:
      MONGO_INITDB_DATABASE: serveease_auth
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017 --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-user:
    image: mongo:7
    container_name: serveease-mongo-user
    volumes:
      - mongo-user-data:/data/db
    networks: [serveease-net]

  mongo-worker:
    image: mongo:7
    container_name: serveease-mongo-worker
    volumes:
      - mongo-worker-data:/data/db
    networks: [serveease-net]

  mongo-booking:
    image: mongo:7
    container_name: serveease-mongo-booking
    volumes:
      - mongo-booking-data:/data/db
    networks: [serveease-net]

  mongo-payment:
    image: mongo:7
    container_name: serveease-mongo-payment
    volumes:
      - mongo-payment-data:/data/db
    networks: [serveease-net]

  mongo-review:
    image: mongo:7
    container_name: serveease-mongo-review
    volumes:
      - mongo-review-data:/data/db
    networks: [serveease-net]

  mongo-admin:
    image: mongo:7
    container_name: serveease-mongo-admin
    volumes:
      - mongo-admin-data:/data/db
    networks: [serveease-net]

  redis:
    image: redis:7-alpine
    container_name: serveease-redis
    volumes:
      - redis-data:/data
    networks: [serveease-net]
    command: redis-server --appendonly yes
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: serveease-rabbitmq
    ports:
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [serveease-net]
    environment:
      RABBITMQ_DEFAULT_USER: serveease
      RABBITMQ_DEFAULT_PASS: serveease123
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Microservices ──────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: serveease-auth
    env_file: ./services/auth-service/.env
    environment:
      - MONGODB_URI=mongodb://mongo-auth:27017/serveease_auth
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://serveease:serveease123@rabbitmq:5672
    networks: [serveease-net]
    depends_on:
      mongo-auth:   { condition: service_healthy }
      redis:        { condition: service_healthy }
      rabbitmq:     { condition: service_healthy }
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: serveease-user
    env_file: ./services/user-service/.env
    environment:
      - PORT=3002
      - MONGODB_URI=mongodb://mongo-user:27017/serveease_users
      - AUTH_SERVICE_URL=http://auth-service:3001
    networks: [serveease-net]
    depends_on: [auth-service, mongo-user]
    restart: unless-stopped

  worker-service:
    build:
      context: .
      dockerfile: services/worker-service/Dockerfile
    container_name: serveease-worker
    env_file: ./services/worker-service/.env
    environment:
      - PORT=3003
      - MONGODB_URI=mongodb://mongo-worker:27017/serveease_workers
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3001
    networks: [serveease-net]
    depends_on: [auth-service, redis, mongo-worker]
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    container_name: serveease-catalog
    environment:
      - PORT=3004
      - REDIS_URL=redis://redis:6379
    networks: [serveease-net]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: serveease-booking
    env_file: ./services/booking-service/.env
    environment:
      - PORT=3005
      - MONGODB_URI=mongodb://mongo-booking:27017/serveease_bookings
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://serveease:serveease123@rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth-service:3001
      - WORKER_SERVICE_URL=http://worker-service:3003
      - PAYMENT_SERVICE_URL=http://payment-service:3006
    networks: [serveease-net]
    depends_on: [auth-service, worker-service, rabbitmq, mongo-booking]
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: serveease-payment
    env_file: ./services/payment-service/.env
    environment:
      - PORT=3006
      - MONGODB_URI=mongodb://mongo-payment:27017/serveease_payments
      - RABBITMQ_URL=amqp://serveease:serveease123@rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth-service:3001
      - WORKER_SERVICE_URL=http://worker-service:3003
      - USER_SERVICE_URL=http://user-service:3002
    networks: [serveease-net]
    depends_on: [auth-service, rabbitmq, mongo-payment]
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: serveease-notification
    env_file: ./services/notification-service/.env
    environment:
      - PORT=3007
      - RABBITMQ_URL=amqp://serveease:serveease123@rabbitmq:5672
    networks: [serveease-net]
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  review-service:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
    container_name: serveease-review
    environment:
      - PORT=3008
      - MONGODB_URI=mongodb://mongo-review:27017/serveease_reviews
      - AUTH_SERVICE_URL=http://auth-service:3001
      - WORKER_SERVICE_URL=http://worker-service:3003
    networks: [serveease-net]
    depends_on: [auth-service, mongo-review]
    restart: unless-stopped

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    container_name: serveease-admin
    environment:
      - PORT=3009
      - MONGODB_URI=mongodb://mongo-admin:27017/serveease_admin
      - WORKER_SERVICE_URL=http://worker-service:3003
      - USER_SERVICE_URL=http://user-service:3002
      - BOOKING_SERVICE_URL=http://booking-service:3005
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - ADMIN_JWT_SECRET=admin_dev_secret_change_in_prod
    networks: [serveease-net]
    depends_on: [worker-service, user-service, booking-service]
    restart: unless-stopped

  # ─── API Gateway ───────────────────────────────────────────────────────────

  api-gateway:
    image: nginx:1.25-alpine
    container_name: serveease-gateway
    ports:
      - "80:80"
      - "8080:80"
      - "443:443"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [serveease-net]
    depends_on:
      - auth-service
      - user-service
      - worker-service
      - catalog-service
      - booking-service
      - payment-service
      - review-service
      - admin-service
    restart: unless-stopped
