events {
  worker_connections 1024;
}

http {
  # ─── Structured JSON Access Log ───────────────────────────────────────────
  log_format json_access escape=json
    '{'
      '"ts":"$time_iso8601",'
      '"level":"info",'
      '"service":"api-gateway",'
      '"method":"$request_method",'
      '"path":"$uri",'
      '"query":"$query_string",'
      '"status":$status,'
      '"duration":$request_time,'
      '"bytes_sent":$bytes_sent,'
      '"ip":"$remote_addr",'
      '"upstream":"$upstream_addr",'
      '"user_agent":"$http_user_agent",'
      '"request_id":"$serveease_request_id"'
    '}';

  access_log /var/log/nginx/access.log json_access;
  error_log  /var/log/nginx/error.log  warn;

  # ─── Rate Limiting ────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

  map $http_x_request_id $serveease_request_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  # Use Docker's internal DNS so nginx re-resolves service IPs after restarts
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    # Upstream addresses as variables — forces per-request DNS resolution
    set $auth_upstream         http://auth-service:3001;
    set $user_upstream         http://user-service:3002;
    set $worker_upstream       http://worker-service:3003;
    set $catalog_upstream      http://catalog-service:3004;
    set $booking_upstream      http://booking-service:3005;
    set $payment_upstream      http://payment-service:3006;
    set $notification_upstream http://notification-service:3007;
    set $review_upstream       http://review-service:3008;
    set $admin_upstream        http://admin-service:3009;

    # ─── CORS headers ────────────────────────────────────────────────────────
    add_header 'Access-Control-Allow-Origin'  '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

    # Hide CORS headers from upstream services to prevent duplicates
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    if ($request_method = OPTIONS) {
      return 204;
    }

    # ─── Health check ─────────────────────────────────────────────────────────
    location /health {
      add_header Content-Type application/json always;
      add_header 'Access-Control-Allow-Origin' '*' always;
      return 200 '{"status":"ok","gateway":"nginx"}';
    }

    # ─── Auth Service ─────────────────────────────────────────────────────────
    location /auth/ {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass         $auth_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-Id      $serveease_request_id;
    }

    # ─── User Service ─────────────────────────────────────────────────────────
    location /users/ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass         $user_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-Id      $serveease_request_id;
    }

    # ─── Worker Service ───────────────────────────────────────────────────────
    location /workers/ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass         $worker_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-Id      $serveease_request_id;
      client_max_body_size 10M;
    }

    # ─── Catalog Service ──────────────────────────────────────────────────────
    location /catalog/ {
      proxy_pass         $catalog_upstream;
      proxy_set_header   Host            $host;
      proxy_set_header   X-Real-IP       $remote_addr;
      proxy_set_header   X-Request-Id    $serveease_request_id;
      proxy_cache_valid  200 1h;
    }

    # ─── Booking Service (HTTP + WebSocket) ───────────────────────────────────
    # Both /bookings and /bookings/* must be listed to prevent nginx from
    # issuing a 301 redirect from /bookings -> /bookings/ which strips the
    # Authorization header on cross-origin requests.
    location /bookings {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass         $booking_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-Id      $serveease_request_id;
    }

    location /socket.io/ {
      proxy_pass         $booking_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Request-Id $serveease_request_id;
    }

    # ─── Payment Service ──────────────────────────────────────────────────────
    location /payments/ {
      limit_req zone=api_limit burst=5 nodelay;
      proxy_pass         $payment_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-Id      $serveease_request_id;
    }

    # ─── Notification Service ─────────────────────────────────────────────────
    location /notifications/ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass         $notification_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-Id      $serveease_request_id;
    }

    # ─── Review Service ───────────────────────────────────────────────────────
    location /reviews/ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass         $review_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Request-Id      $serveease_request_id;
    }

    # ─── Admin Service ────────────────────────────────────────────────────────
    location /admin/ {
      limit_req zone=api_limit burst=5 nodelay;
      proxy_pass         $admin_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-Id      $serveease_request_id;
    }

    # ─── Per-service health endpoints ─────────────────────────────────────────
    location = /auth/health        { proxy_pass $auth_upstream/health; }
    location = /users/health       { proxy_pass $user_upstream/health; }
    location = /workers/health     { proxy_pass $worker_upstream/health; }
    location = /catalog/health     { proxy_pass $catalog_upstream/health; }
    location = /bookings/health    { proxy_pass $booking_upstream/health; }
    location = /payments/health    { proxy_pass $payment_upstream/health; }
    location = /notifications/health { proxy_pass $notification_upstream/health; }
    location = /reviews/health     { proxy_pass $review_upstream/health; }
    location = /admin/health       { proxy_pass $admin_upstream/health; }

    # Block internal routes from outside
    location /internal/ {
      return 403;
    }
  }
}
