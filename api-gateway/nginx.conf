events {
  worker_connections 1024;
}

http {
  # ─── Structured JSON Access Log ───────────────────────────────────────────
  log_format json_access escape=json
    '{'
      '"ts":"$time_iso8601",'
      '"level":"info",'
      '"service":"api-gateway",'
      '"method":"$request_method",'
      '"path":"$uri",'
      '"query":"$query_string",'
      '"status":$status,'
      '"duration":$request_time,'
      '"bytes_sent":$bytes_sent,'
      '"ip":"$remote_addr",'
      '"upstream":"$upstream_addr",'
      '"user_agent":"$http_user_agent",'
      '"request_id":"$request_id"'
    '}';

  access_log /var/log/nginx/access.log json_access;
  error_log  /var/log/nginx/error.log  warn;

  # ─── Rate Limiting ────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

  # ─── Upstream Services ────────────────────────────────────────────────────
  upstream auth_service        { server auth-service:3001; }
  upstream user_service        { server user-service:3002; }
  upstream worker_service      { server worker-service:3003; }
  upstream catalog_service     { server catalog-service:3004; }
  upstream booking_service     { server booking-service:3005; }
  upstream payment_service     { server payment-service:3006; }
  upstream notification_service { server notification-service:3007; }
  upstream review_service      { server review-service:3008; }
  upstream admin_service       { server admin-service:3009; }

  server {
    listen 80;
    server_name _;

    # ─── CORS headers ────────────────────────────────────────────────────────
    add_header 'Access-Control-Allow-Origin'  '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

    # Hide CORS headers from upstream services to prevent duplicates
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    if ($request_method = OPTIONS) {
      return 204;
    }

    # ─── Health check ─────────────────────────────────────────────────────────
    location /health {
      add_header Content-Type application/json always;
      add_header 'Access-Control-Allow-Origin' '*' always;
      return 200 '{"status":"ok","gateway":"nginx"}';
    }

    # ─── Auth Service ─────────────────────────────────────────────────────────
    location /auth/ {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass         http://auth_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ─── User Service ─────────────────────────────────────────────────────────
    location /users/ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass         http://user_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ─── Worker Service ───────────────────────────────────────────────────────
    location /workers/ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass         http://worker_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      client_max_body_size 10M;          # allow file uploads
    }

    # ─── Catalog Service ──────────────────────────────────────────────────────
    location /catalog/ {
      proxy_pass         http://catalog_service;
      proxy_set_header   Host            $host;
      proxy_set_header   X-Real-IP       $remote_addr;
      proxy_cache_valid  200 1h;
    }

    # ─── Booking Service (HTTP + WebSocket) ───────────────────────────────────
    location /bookings/ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass         http://booking_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
      proxy_pass         http://booking_service;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
    }

    # ─── Payment Service ──────────────────────────────────────────────────────
    location /payments/ {
      limit_req zone=api_limit burst=5 nodelay;
      proxy_pass         http://payment_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ─── Notification Service ─────────────────────────────────────────────────
    location /notifications/ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass         http://notification_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ─── Review Service ───────────────────────────────────────────────────────
    location /reviews/ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass         http://review_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
    }

    # ─── Admin Service ────────────────────────────────────────────────────────
    location /admin/ {
      limit_req zone=api_limit burst=5 nodelay;
      proxy_pass         http://admin_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ─── Per-service health endpoints (rewrite prefix before proxying) ────────
    location = /auth/health        { proxy_pass http://auth_service/health; }
    location = /users/health       { proxy_pass http://user_service/health; }
    location = /workers/health     { proxy_pass http://worker_service/health; }
    location = /catalog/health     { proxy_pass http://catalog_service/health; }
    location = /bookings/health    { proxy_pass http://booking_service/health; }
    location = /payments/health    { proxy_pass http://payment_service/health; }
    location = /notifications/health { proxy_pass http://notification_service/health; }
    location = /reviews/health     { proxy_pass http://review_service/health; }
    location = /admin/health       { proxy_pass http://admin_service/health; }

    # Block internal routes from outside
    location /internal/ {
      return 403;
    }
  }
}
